# DNS for live testing: answers every Konami/SaveMGO lookup with this server, and logs each
# query so the game tells you its real hostnames rather than you guessing them.
#
# Point RPCS3's DNS setting at the machine running this.

# Log every query. This is the point of the exercise: watch `docker logs -f nomad-dns`
# while the game boots and you get the exact hostnames your disc version asks for.
log-queries
log-facility=-

# Do not read the host's /etc/resolv.conf or /etc/hosts.
no-resolv
no-hosts

# Anything under these domains resolves to the server. Wildcards rather than exact names,
# because the game touches gate, auth, web and STUN hosts and the names vary by region.
address=/konamionline.com/192.168.1.100
address=/savemgo.com/192.168.1.100

# Everything else goes to a public resolver so the console still has working internet.
server=1.1.1.1
server=8.8.8.8

# NOTE ON PORT 53
# Inside WSL2 the resolver stub already holds port 53, so this cannot be published there:
#   docker run -d --name nomad-dns -p 53:53/udp \
#     -v "$PWD/dev/dnsmasq.conf:/etc/dnsmasq.conf:ro" 4km3/dnsmasq:2.90-r3
# fails with "address already in use". Either free it (disable systemd-resolved) or run this
# container on Windows/another host. Verified working on an alternate port with:
#   docker run -d --name nomad-dns -p 5353:53/udp ...
# which is fine for testing the config, but consoles and RPCS3 will only query port 53.
