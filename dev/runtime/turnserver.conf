# coturn in STUN-only mode — the STUN responder for the port check.
#
# Replaces the hand-rolled dev/runtime/stun_probe.py (kept as a reference/diagnostic). coturn is
# what echo — the one reference server confirmed to play MGO2 online — uses, and swapping it in is
# what got a client past the port check into clean hosting on 2026-07-21. The game speaks classic
# STUN (draft-ietf-behave-rfc3489bis-02); coturn still supports that older change-request model,
# which is why it works where a stripped-down modern STUN server might not.
#
# Two listening IPs are required: NAT classification works by the client asking for a reply from a
# *different* address and checking whether it arrives. The second address must be a real address
# the host owns on the LAN — a secondary IP on the primary adapter (see SETUP.md). Edit both IPs
# here for a different deployment; coturn does no env-var substitution.
#
# Deliberately NOT set:
#  - min-port/max-port (relay range): stun-only never allocates a relay, and omitting it removes any
#    chance of coturn touching the game's UDP 5730 on a host that also runs a client.
#  - rfc5780 (NAT behaviour discovery): coturn 4.5.2 rejects the key and echo runs without it; the
#    change-IP test still works because coturn knows both listening IPs.

stun-only
no-cli
listening-port=3478
alt-listening-port=3479
listening-ip=192.168.1.100
listening-ip=192.168.1.201
