# DIAGNOSTIC ONLY -- not part of the setup, and not normally run.
#
# DNS is not needed to play. RPCS3's DnsHook resolves inside the emulator, so its IP swap list
# does all the redirection and the DNS setting changes nothing. This was confirmed by pointing a
# logging DNS server at the emulator and watching it receive zero packets while the game connected
# happily. See dev/docs/SETUP.md, "What is not needed".
#
# What this is still good for: discovering the hostnames a *different* disc or region asks for.
# Run it, point RPCS3's DNS setting at the machine, boot the game, and read the queries -- the
# game names its own hosts rather than you guessing them, which is how the current swap list was
# built. Once you have the names, put them in the swap list and stop this again.

# Log every query. This is the point of the exercise: watch `docker logs -f nomad-dns`
# while the game boots and you get the exact hostnames your disc version asks for.
log-queries
log-facility=-

# Do not read the host's /etc/resolv.conf or /etc/hosts.
no-resolv
no-hosts

# Anything under these domains resolves to the server. Wildcards rather than exact names,
# because the game touches gate, auth, web and STUN hosts and the names vary by region.
# Both domains are in play: RPCS3's log shows the game asking for
# info.service.konamionline.com AND mgo2web.konami.com. Missing konami.com is why the first
# attempt never matched.
address=/konamionline.com/192.168.1.100
address=/konami.com/192.168.1.100
address=/savemgo.com/192.168.1.100

# MGO2PC's custom RPCS3 build asks for these instead of Konami's domains, so this server can
# back that client without changing anything else. Its DNS setting points here.
address=/mgo2pc.com/192.168.1.100

# Everything else goes to a public resolver so the console still has working internet.
server=1.1.1.1
server=8.8.8.8

# RUNNING IT
#   docker run -d --name nomad-dns \
#     -p 192.168.1.100:53:53/udp -p 192.168.1.100:53:53/tcp \
#     -v "$PWD/dev/dnsmasq.conf:/etc/dnsmasq.conf:ro" 4km3/dnsmasq:2.90-r3
#
# Publish BOTH udp and tcp. RPCS3 resolves via sys_net_bnet_connect to port 53, i.e. DNS over
# TCP; with only udp published those connects hit a closed port and resolution fails silently.
#
# Bind to the LAN address specifically, not 0.0.0.0. Under WSL2 the resolver stub already holds
# 0.0.0.0:53, so publishing there fails with "address already in use" — but it only occupies
# 127.0.0.53, 127.0.0.54 and 10.255.255.254, leaving the LAN address free.
#
# Then watch the game name its own hosts:
#   docker logs -f nomad-dns
