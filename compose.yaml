# Local development stack: Postgres plus both server modes off the same image.
#
# Health checks invoke bash explicitly for its /dev/tcp support, which keeps the runtime image
# free of a HTTP client (the default CMD-SHELL is dash, which has no /dev/tcp). Real
# orchestrators should probe the web server's /health and /ready endpoints directly instead,
# since they speak HTTP themselves and get a real readiness answer.

name: nomad-ng

x-server-env: &server-env
  # Set to DEBUG to trace every packet, including hex dumps, when testing a real client.
  NOMAD_LOG_LEVEL: ${NOMAD_LOG_LEVEL:-INFO}
  NOMAD_DB_URL: jdbc:postgresql://postgres:5432/nomad
  NOMAD_DB_USER: nomad
  NOMAD_DB_PASSWORD: ${NOMAD_DB_PASSWORD:-nomad}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nomad
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: ${NOMAD_DB_PASSWORD:-nomad}
    ports:
      - "${NOMAD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomad -d nomad"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations once, then exits. Both servers wait for it so neither races the schema.
  migrate:
    build: .
    image: nomad-ng:local
    command: ["migrate"]
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One server per lobby, matching the lobby rows created by dev/seed.sql. Each instance answers
  # only its own lobby's commands, so all three must run for a client to get past the gate.
  gate:
    build: .
    image: nomad-ng:local
    command: ["game"]
    environment:
      <<: *server-env
      NOMAD_LOBBY_TYPE: "0"
      NOMAD_LOBBY_ID: "1"
    ports:
      # Observed from a real client: MGO2 dials the gate on 15731, not 5730.
      - "${NOMAD_GATE_PORT:-15731}:5730"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5730"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  account:
    build: .
    image: nomad-ng:local
    command: ["game"]
    environment:
      <<: *server-env
      NOMAD_LOBBY_TYPE: "1"
      NOMAD_LOBBY_ID: "2"
      NOMAD_GAME_PORT: "5731"
    ports:
      - "${NOMAD_ACCOUNT_PORT:-5731}:5731"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5731"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  gamelobby:
    build: .
    image: nomad-ng:local
    command: ["game"]
    environment:
      <<: *server-env
      NOMAD_LOBBY_TYPE: "2"
      NOMAD_LOBBY_ID: "3"
      NOMAD_GAME_PORT: "5732"
    ports:
      - "${NOMAD_LOBBY_PORT:-5732}:5732"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5732"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build: .
    image: nomad-ng:local
    command: ["web"]
    environment: *server-env
    ports:
      - "${NOMAD_WEB_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Development harness for the console's HTTP endpoints. Terminates TLS with a certificate the
  # PS3 trusts (its CA must be installed into RPCS3's dev_flash/data/cert), serves the static
  # documents the client fetches, and proxies anything the application owns to the web server.
  #
  # Bind to the host's LAN address rather than 0.0.0.0, so port 53's neighbours and the WSL2
  # resolver stub do not collide with these.
  probe-http:
    image: python:3.12-alpine
    command: sh -c 'cp -r /wwwsrc /www && python /probe.py 80'
    environment:
      NOMAD_WEB_URL: http://web:8080
    volumes:
      - ./dev/http_probe.py:/probe.py:ro
      - ./dev/www:/wwwsrc:ro
    ports:
      - "${NOMAD_PROBE_HTTP:-192.168.1.100:80}:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  probe-https:
    image: python:3.12-alpine
    command: sh -c 'cp -r /wwwsrc /www && python /probe.py 443 tls'
    environment:
      NOMAD_WEB_URL: http://web:8080
    volumes:
      - ./dev/http_probe.py:/probe.py:ro
      - ./dev/www:/wwwsrc:ro
    ports:
      - "${NOMAD_PROBE_HTTPS:-192.168.1.100:443}:443"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # MGO2 is peer-to-peer for matches, so the client discovers its public address before it will
  # enter a lobby. Without a reachable STUN server it retries UPnP and then fails, which presents
  # as a lobby error rather than a NAT one.
  probe-stun:
    image: python:3.12-alpine
    command: python /stun.py 3478 ${NOMAD_PUBLIC_IP:-192.168.1.100}
    volumes:
      - ./dev/stun_probe.py:/stun.py:ro
    # Host networking, not published ports. Docker's UDP proxy rewrites the source port of
    # replies, and a STUN client checks which address answered — that is the entire mechanism by
    # which it classifies its NAT. Behind the proxy every reply appears to come from a random
    # port and discovery cannot conclude.
    network_mode: host
    restart: unless-stopped

volumes:
  postgres-data:
